name: muslih
description: منصة مُصلح — تطبيق لربط العملاء بمزودي الخدمات المنزلية الموثوقين (فلاتر + سوبرabase).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  supabase_flutter: ^2.8.0
  equatable: ^2.0.5
  google_fonts: ^6.2.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
